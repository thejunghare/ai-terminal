name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -v tests
      - name: zsh plugin syntax
        run: zsh -n plugin/ai-terminal.zsh
      - name: bash plugin syntax (macOS bash 3.2 and Homebrew-era bash)
        run: /bin/bash --version | head -1 && /bin/bash -n plugin/ai-terminal.bash && bash -n plugin/ai-terminal.bash
      - name: Shell scripts syntax
        run: bash -n install.sh && bash -n scripts/setup-github.sh
